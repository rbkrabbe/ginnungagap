apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: ginnungagap
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: ginnungagap
        orgId: 1
        folder: Ginnungagap
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
  ginnungagap.json: |
    {
      "title": "Ginnungagap — Overview",
      "uid": "ginnungagap-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "tags": ["ginnungagap"],
      "timezone": "",
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "KV request rate (req/s) by method",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (rpc_method) (rate(rpc_server_call_duration_seconds_count{rpc_method=~\"ginnungagap\\\\.v1\\\\.KvService/.*\"}[1m]))",
              "legendFormat": "{{rpc_method}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "KV request rate by pod",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (pod) (rate(rpc_server_call_duration_seconds_count{rpc_method=~\"ginnungagap\\\\.v1\\\\.KvService/.*\"}[1m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "KV request latency p50 / p99 (seconds)",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.5, sum by (le, rpc_method) (rate(rpc_server_call_duration_seconds_bucket{rpc_method=~\"ginnungagap\\\\.v1\\\\.KvService/.*\"}[5m])))",
              "legendFormat": "p50 {{rpc_method}}"
            },
            {
              "refId": "B",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.99, sum by (le, rpc_method) (rate(rpc_server_call_duration_seconds_bucket{rpc_method=~\"ginnungagap\\\\.v1\\\\.KvService/.*\"}[5m])))",
              "legendFormat": "p99 {{rpc_method}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Non-OK gRPC status by method",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (rpc_method, rpc_response_status_code) (rate(rpc_server_call_duration_seconds_count{rpc_method=~\"ginnungagap\\\\.v1\\\\.KvService/.*\", rpc_response_status_code!=\"0\"}[1m]))",
              "legendFormat": "{{rpc_method}} / {{rpc_response_status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1":  {"text": "CANCELLED",          "index": 0},
                    "2":  {"text": "UNKNOWN",             "index": 1},
                    "3":  {"text": "INVALID_ARGUMENT",    "index": 2},
                    "4":  {"text": "DEADLINE_EXCEEDED",   "index": 3},
                    "5":  {"text": "NOT_FOUND",           "index": 4},
                    "6":  {"text": "ALREADY_EXISTS",      "index": 5},
                    "7":  {"text": "PERMISSION_DENIED",   "index": 6},
                    "8":  {"text": "RESOURCE_EXHAUSTED",  "index": 7},
                    "9":  {"text": "FAILED_PRECONDITION", "index": 8},
                    "10": {"text": "ABORTED",             "index": 9},
                    "11": {"text": "OUT_OF_RANGE",        "index": 10},
                    "12": {"text": "UNIMPLEMENTED",       "index": 11},
                    "13": {"text": "INTERNAL",            "index": 12},
                    "14": {"text": "UNAVAILABLE",         "index": 13},
                    "15": {"text": "DATA_LOSS",           "index": 14},
                    "16": {"text": "UNAUTHENTICATED",     "index": 15}
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}}
        },
        {
          "id": 5,
          "type": "stat",
          "title": "ggap pods scraped (up)",
          "gridPos": {"x": 0, "y": 16, "w": 8, "h": 4},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "count(up{job=\"otel-collector\"} == 1)"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []},
          "options": {"graphMode": "none"}
        }
      ]
    }
