apiVersion: v1
kind: ConfigMap
metadata:
  name: ggap-tools-scripts
  namespace: ginnungagap
data:
  # Print ClusterStatus from all three nodes side-by-side.
  status: |
    #!/bin/sh
    for i in 0 1 2; do
      addr="ggap-${i}.ggap-headless.ginnungagap.svc.cluster.local:17001"
      printf '\n=== ggap-%s ===\n' "$i"
      grpcurl -plaintext -max-time 3 "$addr" \
        ginnungagap.v1.AdminService/ClusterStatus 2>&1 || true
    done

  # Resolve the current leader and print its client address (host:17000).
  # Exit 1 if no leader is elected yet.
  leader: |
    #!/bin/sh
    SEED="ggap-0.ggap-headless.ginnungagap.svc.cluster.local:17001"
    STATUS=$(grpcurl -plaintext -max-time 5 "$SEED" \
               ginnungagap.v1.AdminService/ClusterStatus 2>&1)
    LEADER_ID=$(printf '%s' "$STATUS" | grep '"leaderId"' | grep -o '[0-9]*' | head -1)
    if [ -z "$LEADER_ID" ]; then
      printf 'no leader elected yet\n%s\n' "$STATUS" >&2
      exit 1
    fi
    ORDINAL=$((LEADER_ID - 1))
    echo "ggap-${ORDINAL}.ggap-headless.ginnungagap.svc.cluster.local:17000"

  # Store a UTF-8 value.  Usage: put <key> <value>
  # gRPC bytes fields are base64 in JSON; this script encodes the value.
  put: |
    #!/bin/sh
    if [ $# -lt 2 ]; then
      echo "usage: put <key> <value>" >&2
      exit 1
    fi
    KEY="$1"; VALUE="$2"
    LEADER=$(leader)
    VALUE_B64=$(printf '%s' "$VALUE" | base64 | tr -d '\n')
    grpcurl -plaintext \
      -d "{\"key\":\"${KEY}\",\"value\":\"${VALUE_B64}\"}" \
      "$LEADER" ginnungagap.v1.KvService/Put

  # Fetch a key and decode the bytes value back to a string.
  # Usage: get <key> [linearizable|sequential|eventual]
  get: |
    #!/bin/sh
    if [ $# -lt 1 ]; then
      echo "usage: get <key> [linearizable|sequential|eventual]" >&2
      exit 1
    fi
    KEY="$1"
    CONSISTENCY="${2:-LINEARIZABLE}"
    LEADER=$(leader)
    RESP=$(grpcurl -plaintext \
             -d "{\"key\":\"${KEY}\",\"consistency\":\"${CONSISTENCY}\"}" \
             "$LEADER" ginnungagap.v1.KvService/Get)
    echo "$RESP"
    # Decode the raw bytes value for readability.
    RAW=$(printf '%s' "$RESP" | grep '"value"' | sed 's/.*"value": "\([^"]*\)".*/\1/')
    if [ -n "$RAW" ]; then
      printf 'decoded value: %s\n' "$(printf '%s' "$RAW" | base64 -d 2>/dev/null)"
    fi

  # Scan a key range.  Usage: scan <start-key> <end-key> [limit]
  scan: |
    #!/bin/sh
    if [ $# -lt 2 ]; then
      echo "usage: scan <start-key> <end-key> [limit]" >&2
      exit 1
    fi
    START="$1"; END="$2"; LIMIT="${3:-100}"
    LEADER=$(leader)
    grpcurl -plaintext \
      -d "{\"startKey\":\"${START}\",\"endKey\":\"${END}\",\"limit\":${LIMIT}}" \
      "$LEADER" ginnungagap.v1.KvService/Scan

  # Delete a key.  Usage: del <key>
  del: |
    #!/bin/sh
    if [ $# -lt 1 ]; then
      echo "usage: del <key>" >&2
      exit 1
    fi
    KEY="$1"
    LEADER=$(leader)
    grpcurl -plaintext \
      -d "{\"key\":\"${KEY}\"}" \
      "$LEADER" ginnungagap.v1.KvService/Delete

  # Drive constant-rate read-heavy load with ghz.
  # Usage: load [qps] [duration]   (defaults: 200 QPS, 24h)
  #
  # Usage: load [qps] [write_pct] [duration]
  #   qps        total target QPS              (default 200)
  #   write_pct  percent of ops that are Puts  (default 20, i.e. read-heavy)
  #   duration   how long to run               (default 24h)
  #
  # Seeds 64 keys (load-0 .. load-63), then runs up to two ghz workers in
  # parallel over that key space: a Get benchmark at the read rate and a Put
  # benchmark at the write rate. Reads therefore hit existing values instead of
  # returning NOT_FOUND. ghz keeps a worker pool open against the leader, so it
  # sustains rates the per-call grpcurl loop never could.
  #
  # Keys are unpadded on purpose: ghz unmarshals -d as JSON before rendering the
  # template, so the template must not contain quotes that would close the JSON
  # string early. {{randomInt 0 64}} renders a bare integer; {{b64enc ...}}
  # renders a quote-free base64 value for the bytes field.
  #
  # ghz prints a report per worker on exit; Ctrl-C stops it early.
  # Examples:  load 1000 0 5m   # pure read, 1000 rps for 5 min
  #            load 500 50      # 50/50 read/write at 500 rps
  load: |
    #!/bin/sh
    set -eu
    QPS="${1:-200}"
    WRITE_PCT="${2:-20}"
    DURATION="${3:-24h}"
    WRITE_QPS=$(( QPS * WRITE_PCT / 100 ))
    READ_QPS=$(( QPS - WRITE_QPS ))
    LEADER=$(leader)
    echo "load: seeding 64 keys via $LEADER"
    i=0
    while [ "$i" -lt 64 ]; do
      VAL_B64=$(printf 'seed-%d' "$i" | base64 | tr -d '\n')
      grpcurl -plaintext \
        -d "{\"key\":\"load-${i}\",\"value\":\"${VAL_B64}\"}" \
        "$LEADER" ginnungagap.v1.KvService/Put >/dev/null
      i=$((i + 1))
    done
    echo "load: ${QPS} rps for ${DURATION} -> $LEADER  (read=${READ_QPS} write=${WRITE_QPS})"
    pids=""
    trap 'kill $pids 2>/dev/null' INT TERM
    if [ "$READ_QPS" -gt 0 ]; then
      ghz --insecure --call ginnungagap.v1.KvService/Get \
        --rps "$READ_QPS" -z "$DURATION" \
        -d '{"key":"load-{{randomInt 0 64}}","consistency":"LINEARIZABLE"}' \
        "$LEADER" &
      pids="$pids $!"
    fi
    if [ "$WRITE_QPS" -gt 0 ]; then
      ghz --insecure --call ginnungagap.v1.KvService/Put \
        --rps "$WRITE_QPS" -z "$DURATION" \
        -d '{"key":"load-{{randomInt 0 64}}","value":"{{b64enc (toString (randomInt 0 1000000))}}"}' \
        "$LEADER" &
      pids="$pids $!"
    fi
    wait $pids
