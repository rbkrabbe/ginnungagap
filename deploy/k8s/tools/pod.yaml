apiVersion: apps/v1
kind: Deployment
metadata:
  name: ggap-tools
  namespace: ginnungagap
  labels:
    app.kubernetes.io/name: ggap-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ggap-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ggap-tools
    spec:
      containers:
        - name: tools
          # Same image as the bootstrap job: grpcurl + Alpine shell.
          image: fullstorydev/grpcurl:v1.9.1-alpine
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          env:
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/scripts
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: scripts
          configMap:
            name: ggap-tools-scripts
            defaultMode: 0555
