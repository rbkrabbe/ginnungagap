kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ggap
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      - containerPort: 30700
        hostPort: 17000
        protocol: TCP
      - containerPort: 30701
        hostPort: 17001
        protocol: TCP
      - containerPort: 30880
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
